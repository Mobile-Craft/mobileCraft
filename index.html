    <!--

    <script type="application/ld+json">

    <!--
      Las fuentes se cargan sin bloquear el render: `preload` las pide con
      prioridad alta y el `onload` las promueve a hoja de estilos ya descargada.
      Con `display=swap` el texto se pinta en la fuente de respaldo y cambia al
      llegar la definitiva, en lugar de dejar la página en blanco esperándola.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>

    <!-- Analítica sin cookies ni datos personales: no necesita banner de consentimiento. -->
    <script defer data-domain="eldertavarez.dev" src="https://plausible.io/js/script.js"></script>

    <script>
      /*
       * Script de arranque: resuelve tema e idioma antes del primer paint, para
       * que no haya flash de color ni un lector de pantalla anunciando el
       * idioma equivocado.
       *
       * Es el ÚNICO sitio donde se decide el idioma. React lee el resultado de
       * `<html lang>` en vez de repetir la regla: cuando estaba duplicada, las
       * dos copias usaban heurísticas distintas y podían discrepar.
       *
       * Prioridad: `?lang=` (enlace compartido) > preferencia guardada >
       * idioma del navegador > español.
       */
      (function () {
        var doc = document.documentElement;

        function stored(key) {
          try {
            return localStorage.getItem(key);
          } catch (e) {
            return null; // modo privado: se usan los valores por defecto
          }
        }

        var theme = stored('et-theme') === 'light' ? 'light' : 'dark';
        doc.dataset.theme = theme;
        doc.style.colorScheme = theme;

        var lang = null;
        try {
          lang = new URLSearchParams(location.search).get('lang');
        } catch (e) {
          /* URL malformada: se sigue con el resto de la cadena */
        }

        if (lang !== 'es' && lang !== 'en') lang = stored('et-lang');

        if (lang !== 'es' && lang !== 'en') {
          var preferred = navigator.languages || [navigator.language || 'es'];
          lang = 'es';
          for (var i = 0; i < preferred.length; i++) {
            var base = String(preferred[i]).toLowerCase().split('-')[0];
            if (base === 'es' || base === 'en') {
              lang = base;
              break;
            }
          }
        }

        doc.lang = lang;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
