name: CI

# El README prometía que `npm run check` corría en CI; esto es lo que lo hace
# cierto. Sin el workflow, la comprobación depende de que alguien se acuerde.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tipos, lint, formato y tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Tests
        run: npm run test

      - name: Build de producción
        run: npm run build
